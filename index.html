<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>BOK</title>

<link
    rel="stylesheet"
    href="style.css"
>

</head>

<body>

<div class="page">

    <div class="card">

        <h2>البحث عن حساب</h2>

        <input
            id="account"
            type="text"
            inputmode="numeric"
            maxlength="7"
            autocomplete="off"
            placeholder="رقم الحساب"
        >

        <button
            id="searchBtn"
            type="button"
        >
            بحث
        </button>

        <div
            id="msg"
            class="message"
        ></div>


        <div
            id="result"
            class="result hidden"
        >

            <div class="item">
                <span>رقم الحساب</span>
                <strong id="rAccount">-</strong>
            </div>

            <div class="item">
                <span>الاسم</span>
                <strong id="rName">-</strong>
            </div>

            <div class="item">
                <span>الحالة</span>
                <strong id="rActive">-</strong>
            </div>

            <div class="item">
                <span>الاشتراك</span>
                <strong id="rSub">-</strong>
            </div>

            <div class="item">
                <span>البداية</span>
                <strong id="rStart">-</strong>
            </div>

            <div class="item">
                <span>النهاية</span>
                <strong id="rEnd">-</strong>
            </div>


            <select id="period">

                <option value="1">
                    يوم واحد
                </option>

                <option value="7">
                    أسبوع واحد
                </option>

                <option value="30">
                    شهر واحد
                </option>

                <option value="90">
                    3 شهور
                </option>

                <option value="365">
                    12 شهر
                </option>

            </select>


            <button
                id="renewBtn"
                type="button"
            >
                تجديد الاشتراك
            </button>

        </div>

    </div>

</div>


<!-- =========================================
     Success Dialog
========================================= -->

<div
    id="iosSuccessDialog"
    aria-hidden="true"
>

    <div class="ios-dialog">

        <div class="ios-success-icon">
            <span>✓</span>
        </div>

        <div class="ios-dialog-title">
            تم التجديد بنجاح
        </div>

        <div
            id="successMessage"
            class="ios-dialog-message"
        >
            تم تجديد الاشتراك بنجاح
        </div>

        <div class="ios-info">

            <div class="ios-row">

                <span>
                    رقم الحساب
                </span>

                <strong id="successAccount">
                    -
                </strong>

            </div>


            <div class="ios-row">

                <span>
                    الاشتراك
                </span>

                <strong id="successSubscription">
                    -
                </strong>

            </div>


            <div class="ios-row">

                <span>
                    تاريخ الانتهاء
                </span>

                <strong id="successEnd">
                    -
                </strong>

            </div>

        </div>


        <button
            id="successOk"
            class="ios-ok"
            type="button"
        >
            حسناً
        </button>

    </div>

</div>


<!-- =========================================
     Error Dialog
========================================= -->

<div
    id="iosErrorDialog"
    aria-hidden="true"
>

    <div class="ios-dialog">

        <div class="ios-error-icon">
            <span>!</span>
        </div>

        <div class="ios-dialog-title">
            حدث خطأ
        </div>

        <div
            id="errorMessage"
            class="ios-dialog-message"
        >
            تعذر تنفيذ العملية
        </div>


        <button
            id="errorOk"
            class="ios-ok"
            type="button"
        >
            حسناً
        </button>

    </div>

</div>
