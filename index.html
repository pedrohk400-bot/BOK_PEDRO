<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#070a10"
    >

    <title>BOK-PED</title>


    <!-- =====================================
         CSS
    ====================================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >


    <!-- =====================================
         Firebase
    ====================================== -->

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

</head>


<body>


    <!-- =====================================
         الصفحة الرئيسية
    ====================================== -->

    <div class="container">

        <div class="card">


            <!-- العنوان -->

            <h1>
                BOK-PED
            </h1>


            <p class="subtitle">
                البحث عن حساب
            </p>


            <!-- =================================
                 البحث
            ================================== -->

            <div class="search-box">

                <input
                    type="text"
                    id="account"
                    maxlength="7"
                    inputmode="numeric"
                    autocomplete="off"
                    placeholder="رقم الحساب"
                >

                <button id="searchBtn">
                    بحث
                </button>

            </div>


            <!-- رسالة الحالة -->

            <div
                id="msg"
                class="message"
            ></div>


            <!-- =================================
                 بيانات الحساب
            ================================== -->

            <div
                id="result"
                class="result hidden"
            >


                <!-- رقم الحساب -->

                <div class="row">

                    <span>
                        رقم الحساب
                    </span>

                    <strong id="rAccount">
                        -
                    </strong>

                </div>


                <!-- الاسم -->

                <div class="row">

                    <span>
                        الاسم
                    </span>

                    <strong id="rName">
                        -
                    </strong>

                </div>


                <!-- الحالة -->

                <div class="row">

                    <span>
                        الحالة
                    </span>

                    <strong id="rActive">
                        -
                    </strong>

                </div>


                <!-- الاشتراك -->

                <div class="row">

                    <span>
                        الاشتراك
                    </span>

                    <strong id="rSub">
                        -
                    </strong>

                </div>


                <!-- البداية -->

                <div class="row">

                    <span>
                        البداية
                    </span>

                    <strong id="rStart">
                        -
                    </strong>

                </div>


                <!-- النهاية -->

                <div class="row">

                    <span>
                        النهاية
                    </span>

                    <strong id="rEnd">
                        -
                    </strong>

                </div>


                <!-- =================================
                     التجديد
                ================================== -->

                <div class="renew-box">


                    <select id="period">

                        <option value="1">
                            يوم واحد
                        </option>

                        <option value="7">
                            7 أيام
                        </option>

                        <option value="30">
                            30 يوم
                        </option>

                        <option value="90">
                            90 يوم
                        </option>

                        <option value="365">
                            12 شهر
                        </option>

                    </select>


                    <button id="renewBtn">
                        تجديد الاشتراك
                    </button>


                </div>


            </div>


        </div>

    </div>



    <!-- =====================================
         نافذة النجاح
    ====================================== -->

    <div
        id="iosSuccessDialog"
        class="ios-dialog"
        aria-hidden="true"
    >

        <div class="ios-dialog-box">


            <div class="dialog-icon success-icon">
                ✓
            </div>


            <h2 id="successTitle">
                تمت العملية
            </h2>


            <p id="successMessage"></p>


            <div class="dialog-info">


                <div>

                    <span>
                        رقم الحساب
                    </span>

                    <strong id="successAccount">
                        -
                    </strong>

                </div>


                <div>

                    <span>
                        الاشتراك
                    </span>

                    <strong id="successSubscription">
                        -
                    </strong>

                </div>


                <div>

                    <span>
                        النهاية
                    </span>

                    <strong id="successEnd">
                        -
                    </strong>

                </div>


            </div>


            <button id="successOk">
                موافق
            </button>


        </div>

    </div>



    <!-- =====================================
         نافذة الخطأ
    ====================================== -->

    <div
        id="iosErrorDialog"
        class="ios-dialog"
        aria-hidden="true"
    >

        <div class="ios-dialog-box">


            <div class="dialog-icon error-icon">
                !
            </div>


            <h2 id="errorTitle">
                تنبيه
            </h2>


            <p id="errorMessage"></p>


            <button id="errorOk">
                موافق
            </button>


        </div>

    </div>



    <!-- =====================================
         Firebase Configuration
    ====================================== -->

    <script>

        const firebaseConfig = {

            apiKey:
                "AIzaSyDnvmRTgZl1p325V3TmCjIH-PnPfjJPPpk",

            authDomain:
                "bok-ped.firebaseapp.com",

            databaseURL:
                "https://bok-ped-default-rtdb.firebaseio.com",

            projectId:
                "bok-ped",

            storageBucket:
                "bok-ped.firebasestorage.app",

            messagingSenderId:
                "812838230843",

            appId:
                "1:812838230843:web:f3bd5f59343db42b52b51e",

            measurementId:
                "G-26SMZR0QCC"

        };


        // تشغيل Firebase

        firebase.initializeApp(
            firebaseConfig
        );


        // Firebase Authentication

        const auth =
            firebase.auth();


        // Realtime Database

        const database =
            firebase.database();

    </script>



    <!-- =====================================
         JavaScript الخاص بالموقع
    ====================================== -->

    <script src="app.js"></script>


</body>

</html>
