<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BOK</title>
<link rel="stylesheet" href="./style.css">
</head>

<body>

<div class="page">

<div id="app" class="card">

<h2>البحث عن حساب</h2>

<input id="account"
type="text"
inputmode="numeric"
maxlength="7"
placeholder="رقم الحساب">

<button id="searchBtn">بحث</button>

<div id="msg" class="message"></div>

<div id="result" class="result hidden">

<div class="item">
<span>رقم الحساب</span>
<strong id="rAccount">-</strong>
</div>

<div class="item">
<span>الاسم</span>
<strong id="rName">-</strong>
</div>

<div class="item">
<span>الحالة</span>
<strong id="rActive">-</strong>
</div>

<div class="item">
<span>الاشتراك</span>
<strong id="rSub">-</strong>
</div>

<div class="item">
<span>البداية</span>
<strong id="rStart">-</strong>
</div>

<div class="item">
<span>النهاية</span>
<strong id="rEnd">-</strong>
</div>

<select id="period">
<option value="1">يوم واحد</option>
<option value="7">أسبوع واحد</option>
<option value="30">شهر واحد</option>
<option value="90">3 شهور</option>
<option value="365">12 شهر</option>
</select>

<button id="renewBtn">تجديد الاشتراك</button>

</div>
</div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="./app.js?v=22"></script>

</body>
</html>
